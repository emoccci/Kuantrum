<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuantrum</title>
</head>
<body style="background:#111827;color:white;text-align:center;font-family:Arial;">
    <h1>🤖 KUANTRUM</h1>
    <p>Hoş geldin! Bu Kuantrum'un ilk web sayfası.</p>

    <input id="mesaj" placeholder="Mesajını yaz">
    <button onclick="gonder()">Gönder</button>

    <p id="cevap"></p>

    <script>
        function gonder() {
    let mesaj = document.getElementById("mesaj").value;
    let cevap = "";

    if (mesaj.toLowerCase().includes("merhaba")) {
    cevap = "Merhaba! Ben Kuantrum 🤖";
} else if (mesaj.toLowerCase().includes("nasılsın")) {
    cevap = "İyiyim, teşekkürler!";
} else if (mesaj.toLowerCase().includes("adın ne")) {
    cevap = "Benim adım Kuantrum 🤖";
} else if (mesaj.toLowerCase().includes("ne yapabilirsin")) {
    cevap = "Sorularını cevaplayabilir ve seninle sohbet edebilirim!";
} else if (mesaj.toLowerCase().includes("kaç yaşındasın")) {
    cevap = "Ben bir yapay zekayım, yaşım yok 😄";
} else {
    cevap = "Bunu henüz bilmiyorum ama öğrenmeye çalışıyorum: " + mesaj;
    }

    document.getElementById("cevap").innerText = "Kuantrum: " + cevap;
        let ses = new SpeechSynthesisUtterance("Kuantrum: " + cevap);
ses.lang = "tr-TR";
speechSynthesis.speak(ses);}
        
    </script>
</body>
</html>
