<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kuantrum V4</title>

<style>

body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin-top:20px;
}

#robot{
    font-size:70px;
    animation:hareket 1s infinite;
}

@keyframes hareket{
    0%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
    100%{transform:translateY(0);}
}

#sohbet{
    width:90%;
    max-width:500px;
    height:350px;
    margin:auto;
    overflow:auto;
    background:#1f2937;
    border-radius:15px;
    padding:10px;
}

.mesaj{
    padding:10px;
    margin:8px;
    border-radius:10px;
}

.kullanici{
    background:#2563eb;
    text-align:right;
}

.kuantrum{
    background:#374151;
    text-align:left;
}

input{
    width:60%;
    padding:12px;
    border-radius:10px;
    border:none;
}

button{
    padding:12px;
    border-radius:10px;
    margin:5px;
}

</style>

</head>

<body>

<h1>🤖 KUANTRUM V4</h1>

<div id="robot">🤖</div>

<div id="sohbet"></div>

<input id="mesaj" placeholder="Kuantrum'a yaz">

<button onclick="gonder()">Gönder</button>
<script>

let sesAcik = true;


function ekle(kim,yazi){

let alan = document.getElementById("sohbet");

let mesaj = document.createElement("div");

mesaj.className="mesaj "+kim;

mesaj.innerText=yazi;

alan.appendChild(mesaj);

alan.scrollTop=alan.scrollHeight;

}



async function gonder(){

let kutu=document.getElementById("mesaj");

let mesaj=kutu.value;

if(mesaj=="") return;


ekle("kullanici","Sen: "+mesaj);


let cevap="";


try{

let veri=await fetch("/api/chat",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

mesaj:mesaj

})

});


let sonuc=await veri.json();

cevap=sonuc.cevap;


}

catch{

cevap="Bağlantı hatası oldu 🤖";

}



if(!cevap){

cevap="Şu an cevap veremiyorum 🤖";

}



ekle("kuantrum","Kuantrum: "+cevap);



if(sesAcik){

let ses=new SpeechSynthesisUtterance(cevap);

ses.lang="tr-TR";

speechSynthesis.speak(ses);

}



kutu.value="";


}
    </script>

</body>
</html>
